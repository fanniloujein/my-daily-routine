name: Fanni's Education — CI

on:
  push:
    paths: ["fannis-education/**", ".github/workflows/fannis-education.yml"]
  pull_request:
    paths: ["fannis-education/**", ".github/workflows/fannis-education.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fannis-education
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fannis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fannis_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fannis_test
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fannis-education/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
